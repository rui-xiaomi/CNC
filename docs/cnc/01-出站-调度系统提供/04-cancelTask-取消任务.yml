docs: |-
  取消任务。taskId 取自本集合上一次下发时存下的 lastTaskId，也可以手工改成具体任务号。

  注意：取消之后小车和车上的容器需要人工处理，本系统的做法是开工单并锁定点位。
  RCS 侧若返回已取消或查无此任务，本地一律按取消收口。

